<!DOCTYPE html>
<html lang="pt-BR" class="smooth-scroll">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DU Store - A principal loja de contas, boosts e serviços gaming com pegada street.">
    <title>DU Store | Premium Gaming & Street Culture</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. VARIÁVEIS GLOBAIS (DESIGN SYSTEM)
           ========================================================================== */
        :root {
            /* Paleta de Cores Premium (Menos neon saturado, mais tons profundos) */
            --color-bg-base: #050505;
            --color-bg-surface: #111111;
            --color-bg-glass: rgba(17, 17, 17, 0.6);
            
            --color-primary: #6B21A8; /* Roxo profundo/elétrico */
            --color-primary-glow: rgba(107, 33, 168, 0.4);
            --color-accent: #10B981; /* Verde esmeralda para dar contraste street */
            
            --color-text-main: #F3F4F6;
            --color-text-muted: #9CA3AF;
            --color-border: #27272A;
            
            /* Tipografia */
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Inter', sans-serif;
            
            /* Espaçamentos e Layout */
            --container-max: 1440px;
            --spacing-sm: 1rem;
            --spacing-md: 2rem;
            --spacing-lg: 4rem;
            --spacing-xl: 8rem;
            
            /* Transições */
            --transition-smooth: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-fast: all 0.3s ease;
        }

        /* ==========================================================================
           2. RESET E CONFIGURAÇÕES BASE
           ========================================================================== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html.smooth-scroll {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--color-bg-base);
            color: var(--color-text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection {
            background: var(--color-primary);
            color: #fff;
        }

        /* ==========================================================================
           3. UTILITÁRIOS E COMPONENTES
           ========================================================================== */
        .container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 2.5rem;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border: none;
            position: relative;
            overflow: hidden;
            background: transparent;
            color: var(--color-text-main);
            transition: var(--transition-fast);
        }

        .btn-primary {
            background: var(--color-text-main);
            color: var(--color-bg-base);
            border-radius: 2px;
        }

        /* Efeito de hover "Varredura" no botão */
        .btn-primary::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-primary);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
        }
        
        .btn-primary:hover::after {
            transform: scaleY(1);
        }

        .btn-primary span {
            position: relative;
            z-index: 2;
            transition: var(--transition-fast);
        }
        
        .btn-primary:hover span {
            color: #fff;
        }

        /* ==========================================================================
           4. NAVBAR (GLASSMORPHISM)
           ========================================================================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            padding: 1.5rem 0;
            background: var(--color-bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition-smooth);
        }

        header.scrolled {
            padding: 1rem 0;
            background: rgba(5, 5, 5, 0.9);
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: var(--color-text-main);
            text-decoration: none;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Um detalhe sutil street no logo */
        .brand span {
            color: var(--color-primary);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        .nav-links a {
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition-fast);
            position: relative;
        }

        /* Efeito de underline moderno */
        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--color-primary);
            transition: var(--transition-smooth);
        }

        .nav-links a:hover {
            color: var(--color-text-main);
        }

        .nav-links a:hover::before {
            width: 100%;
        }

        /* ==========================================================================
           5. HERO SECTION (PARALLAX + MODERN LAYOUT)
           ========================================================================== */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            overflow: hidden;
            padding-top: 80px; /* Compensa a navbar */
        }

        /* Grid de fundo street/tech */
        .hero-bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
            transform: translateZ(0); /* Aceleração de hardware */
        }

        /* Gradiente de luz indireta para dar profundidade */
        .hero-glow {
            position: absolute;
            top: 20%;
            left: 10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--color-primary-glow) 0%, transparent 60%);
            filter: blur(80px);
            z-index: 2;
            opacity: 0.5;
            animation: pulse-glow 8s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
            100% { transform: scale(1.1) translate(5%, 5%); opacity: 0.7; }
        }

        .hero-content {
            position: relative;
            z-index: 10;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: center;
        }

        .hero-text-area {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: flex-start;
        }

        .hero-badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: 50px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--color-accent);
            background: rgba(16, 185, 129, 0.05);
            backdrop-filter: blur(5px);
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: 7vw; /* Tipografia ultra responsiva e massiva */
            line-height: 0.9;
            text-transform: uppercase;
            margin: 0;
        }

        .hero-title .outline {
            color: transparent;
            -webkit-text-stroke: 2px var(--color-text-main);
            display: block;
        }

        .hero-desc {
            font-size: 1.2rem;
            color: var(--color-text-muted);
            max-width: 80%;
            font-weight: 300;
        }

        .hero-stats {
            display: flex;
            gap: 3rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--color-border);
        }

        .stat-item h4 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: var(--color-text-main);
            line-height: 1;
        }

        .stat-item p {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text-muted);
        }

        /* Objeto 3D/Parallax falso na direita (pode ser uma imagem depois) */
        .hero-visual {
            position: relative;
            height: 600px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* Para o efeito 3D que faremos depois */
        }

        .hero-visual-box {
            width: 80%;
            height: 80%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            transform: rotateY(-15deg) rotateX(5deg);
            transition: transform 0.5s ease-out;
            box-shadow: -20px 20px 50px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==========================================================================
           6. ESPAÇO PARA AS PRÓXIMAS SEÇÕES (SCROLL TEST)
           ========================================================================== */
        .spacer {
            height: 150vh;
            background: var(--color-bg-base);
            position: relative;
            z-index: 20;
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="container nav-wrapper">
            <a href="#" class="brand">DU<span>.</span>STORE</a>
            <nav class="nav-links">
                <a href="#contas">Contas</a>
                <a href="#boost">Boost</a>
                <a href="#moedas">Moedas</a>
                <a href="#sobre">A Marca</a>
            </nav>
            <button class="btn btn-primary" style="padding: 0.6rem 1.5rem; font-size: 0.8rem;">
                <span>Painel</span>
            </button>
        </div>
    </header>

    <section class="hero" id="hero-section">
        <div class="hero-bg-grid" id="parallax-bg"></div>
        <div class="hero-glow"></div>
        
        <div class="container hero-content">
            <div class="hero-text-area">
                <div class="hero-badge">A Nova Era do Gaming</div>
                <h1 class="hero-title" id="parallax-title">
                    Eleve o <br>
                    <span class="outline">Seu Nível.</span>
                </h1>
                <p class="hero-desc">Esqueça o amadorismo. Contas premium, boosters de elite e mercado negro de moedas digitais. A estética das ruas com a performance que os servidores exigem.</p>
                
                <button class="btn btn-primary" style="margin-top: 1rem;">
                    <span>Acessar Arsenal</span>
                </button>

                <div class="hero-stats">
                    <div class="stat-item">
                        <h4>15K+</h4>
                        <p>Clientes</p>
                    </div>
                    <div class="stat-item">
                        <h4>0%</h4>
                        <p>Taxa de Ban</p>
                    </div>
                    <div class="stat-item">
                        <h4>24/7</h4>
                        <p>Suporte</p>
                    </div>
                </div>
            </div>

            <div class="hero-visual" id="hero-visual-container">
                <div class="hero-visual-box" id="hero-3d-box">
                    <span style="color: rgba(255,255,255,0.2); font-family: var(--font-display); font-size: 4rem; letter-spacing: 10px;">DU.STORE</span>
                </div>
            </div>
        </div>
    </section>

    <div class="spacer"></div>

    <script>
        /* ==========================================================================
           JAVASCRIPT BASE (Interatividade de alto nível)
           ========================================================================== */
        
        // 1. Navbar mudando ao dar Scroll
        const header = document.getElementById('main-header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // 2. Parallax Effect Sutil no Scroll
        const parallaxBg = document.getElementById('parallax-bg');
        const parallaxTitle = document.getElementById('parallax-title');
        
        window.addEventListener('scroll', () => {
            let scrollY = window.scrollY;
            // Move o background sutilmente para baixo
            parallaxBg.style.transform = `translateY(${scrollY * 0.3}px)`;
            // Move o título numa velocidade diferente para dar profundidade
            parallaxTitle.style.transform = `translateY(${scrollY * 0.15}px)`;
        });

        // 3. Efeito 3D Tilt no Elemento Visual da Hero com o Mouse
        const visualContainer = document.getElementById('hero-visual-container');
        const box3D = document.getElementById('hero-3d-box');

        visualContainer.addEventListener('mousemove', (e) => {
            const rect = visualContainer.getBoundingClientRect();
            const x = e.clientX - rect.left; // Posição X do mouse dentro do container
            const y = e.clientY - rect.top;  // Posição Y do mouse dentro do container
            
            // Calcula o centro do container
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // Calcula a rotação (quanto mais longe do centro, maior a rotação)
            const rotateX = ((y - centerY) / centerY) * -15; // Max 15 graus
            const rotateY = ((x - centerX) / centerX) * 15;  // Max 15 graus

            // Aplica a transformação
            box3D.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            box3D.style.transition = 'none'; // Tira a transição para seguir o mouse rápido
        });

        // Quando o mouse sai, volta ao normal de forma suave
        visualContainer.addEventListener('mouseleave', () => {
            box3D.style.transform = `rotateX(5deg) rotateY(-15deg)`;
            box3D.style.transition = 'transform 0.5s ease-out';
        });
    </script>
</body>
</html>
