<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Confirmado - DuStore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fundo escuro com um leve gradiente radial vermelho */
            background: radial-gradient(circle at center, #2a0a0a 0%, #050505 100%);
            color: #fff;
            overflow: hidden;
        }

        /* Estilo de Vidro (Glassmorphism) */
        .glass-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8), 
                        inset 0 0 15px rgba(255, 0, 0, 0.1);
            width: 90%;
            max-width: 450px;
        }

        .icon-check {
            font-size: 60px;
            color: #ff3333;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(255, 51, 51, 0.5));
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .btn-discord {
            display: inline-block;
            background: #ff3333;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.3);
        }

        .btn-discord:hover {
            background: #cc0000;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 51, 51, 0.5);
        }

        /* Pequena animação de entrada */
        .glass-box {
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="glass-box">
        <div class="icon-check">✔</div>
        <h1>Pagamento Confirmado</h1>
        <p>Obrigado por comprar na <strong>DuStore</strong>! Seu pedido está sendo processado.</p>
        
        <a href="https://discord.gg/seulink" target="_blank" class="btn-discord">
            IR PARA O DISCORD
        </a>
    </div>

</body>
</html>
